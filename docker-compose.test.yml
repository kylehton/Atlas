services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: atlas_test
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
    ports:
      - 127.0.0.1:${ATLAS_TEST_POSTGRES_PORT:-0}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
